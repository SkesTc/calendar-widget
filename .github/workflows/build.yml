name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 不簽署，只確認 R8 縮減／混淆後能正常建置。
      - name: Build release (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # 推送 v1.0.0 這類 tag 時，用 repo secrets 裡的金鑰產生要上傳 Play 的 AAB。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          CW_KEYSTORE_BASE64: ${{ secrets.CW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CW_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 CW_KEYSTORE_BASE64 secret，請見 docs/release.md"
            exit 1
          fi
          echo "$CW_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "CW_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          CW_KEYSTORE_PASSWORD: ${{ secrets.CW_KEYSTORE_PASSWORD }}
          CW_KEY_ALIAS: ${{ secrets.CW_KEY_ALIAS }}
          CW_KEY_PASSWORD: ${{ secrets.CW_KEY_PASSWORD }}
          # 每次上傳 Play 都要比上一次大；用 GitHub Actions 的執行編號。
          CW_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
